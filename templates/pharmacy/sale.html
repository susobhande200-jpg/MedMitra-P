{% extends 'base.html' %}{% block title %}New Medicine Sale | MedMitra{% endblock %}{% block content %}<section class="admin-shell"><div class="container py-5" style="max-width:760px"><div class="eyebrow">PHARMACY BILLING</div><h1>Record a medicine sale</h1><p class="text-secondary">A receipt is created and stock is reduced in the same database transaction.</p><form method="post" class="panel-card p-4">{% csrf_token %}<div class="mb-3"><label class="form-label">Customer name (optional)</label><input class="form-control" name="patient_name" maxlength="160"></div><div class="mb-3"><label class="form-label">Medicine</label><select class="form-select" name="medicine" required>{% for m in medicines %}<option value="{{ m.pk }}">{{ m.name }} {{ m.strength }} — {{ m.quantity }} available — ₹{{ m.selling_price }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Quantity</label><input class="form-control" type="number" name="quantity" min="1" value="1" required></div><div class="mb-3"><label class="form-label">Payment method</label><select class="form-select" name="payment_method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select></div><button class="btn btn-primary rounded-pill">Save sale & update stock</button> <a class="btn btn-outline-secondary rounded-pill" href="{% url 'pharmacy_dashboard' %}">Cancel</a></form></div></section>{% endblock %}
